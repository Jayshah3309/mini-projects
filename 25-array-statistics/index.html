<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Array Statistics</title><link rel="stylesheet" href="../assets/brief.css"><style>textarea{width:100%;min-height:100px;padding:14px;font:16px monospace;background:#142534;color:#edf4f3;border:1px solid #718599;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.stat{padding:16px;border:1px solid #496275;border-radius:10px}.stat strong{display:block;font-size:24px;color:#a7e5d0}.stat span{font-size:13px}button{padding:10px 18px;background:#a7e5d0;color:#142534;border:0;border-radius:8px;font:600 15px system-ui;cursor:pointer}label{display:block;margin-bottom:8px}.error{color:#f4ddb3;margin:12px 0;min-height:1.6em}button:focus-visible,textarea:focus-visible{outline:3px solid #a7e5d0;outline-offset:3px}</style><link rel="stylesheet" href="../assets/accessibility.css">
</head><body><main class="card"><a href="../index.html">← Project gallery</a><h1>Array Statistics</h1><p>Compare six useful summaries of a number list.</p><label for="numbers">Numbers, separated by commas or whitespace</label><textarea id="numbers">1, 2, 3, 4</textarea><button type="button" onclick="showStats()">Calculate statistics</button><p id="error" class="error" role="status"></p><div id="result" class="stats" aria-live="polite"></div></main><script>
function calculateStats(text){
 const tokens=text.trim().split(/[,\s]+/).filter(Boolean);if(!tokens.length)throw new Error('Enter at least one number.');if(tokens.length>10000)throw new Error('Use at most 10000 numbers.');
 const values=tokens.map(Number);if(values.some(x=>!Number.isFinite(x)))throw new Error('Every entry must be a finite number.');
 const sorted=[...values].sort((a,b)=>a-b),sum=values.reduce((a,b)=>a+b,0);if(!Number.isFinite(sum))throw new Error('The numeric range is too large.');const mid=Math.floor(sorted.length/2);
 return {Count:values.length,Sum:sum,Minimum:sorted[0],Maximum:sorted.at(-1),Mean:sum/values.length,Median:sorted.length%2?sorted[mid]:sorted[mid-1]/2+sorted[mid]/2};
}
function showStats(){const result=document.getElementById('result'),error=document.getElementById('error');result.replaceChildren();try{const stats=calculateStats(document.getElementById('numbers').value);error.textContent='';for(const [name,value] of Object.entries(stats)){const box=document.createElement('div');box.className='stat';const n=document.createElement('strong');n.textContent=new Intl.NumberFormat(undefined,{maximumSignificantDigits:12}).format(value);const label=document.createElement('span');label.textContent=name;box.append(n,label);result.append(box)}}catch(e){error.textContent=e.message}}
showStats();
</script><script src="../assets/projects.js"></script><script src="../assets/project-guide.js"></script></body></html>
