name: Project proposal
description: Propose a feature or complete a planned project.
title: "[Project]: "
body:
  - type: input
    id: project
    attributes:
      label: Project number or name
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and acceptance example
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Runtime, storage and limitations
